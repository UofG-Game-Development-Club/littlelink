<!DOCTYPE html>

<!--
  Theme: theme-auto follows the visitor's system, theme-dark / theme-light force one.
-->

<html class="theme-dark" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Guelph Game Dev | Links</title>
    <link rel="icon" type="image/png" href="images/logo.png">

    <meta name="description" content="The University of Guelph’s Game Development Club. Meetings every Wednesday at 4:30 PM.">
    <link rel="canonical" href="https://links.gryphgame.dev">
    <meta name="author" content="Guelph Game Development Club">

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- How the page looks when shared on Discord, Instagram DMs, etc. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Guelph Game Dev">
    <meta property="og:description" content="The University of Guelph’s Game Development Club. Meetings every Wednesday at 4:30 PM.">
    <meta property="og:url" content="https://links.gryphgame.dev">
    <meta property="og:image" content="https://links.gryphgame.dev/images/logo@2x.png">
    <meta name="twitter:card" content="summary">

    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!-- Replace images/logo.png (128x128) and images/logo@2x.png (256x256) with the club logo -->
            <img class="avatar avatar--rounded" src="images/logo.png" srcset="images/logo@2x.png 2x" alt="Guelph Game Dev logo" width="128" height="128" fetchpriority="high">

            <h1>Guelph Game Dev</h1>

            <p>The University of Guelph’s Game Development Club<br>Meetings every Wednesday at 4:30 PM</p>

            <nav class="button-stack" aria-label="Links">

              <!-- Event of the moment: swap the link and text, or delete this button when there's nothing coming up -->
              <a class="button button-default" href="https://www.zeffy.com/en-CA/ticketing/akedo-festival--2026" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-calendar.svg" alt="Calendar Icon">Trivia Night · Nov 7</a>

              <!-- Discord -->
              <a class="button button-discord" href="https://discord.gg/uofg" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/discord.svg" alt="Discord Logo">Join our Discord</a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/gamedev_guelph/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- LinkedIn -->
              <a class="button button-linked" href="https://www.linkedin.com/company/144016997/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="LinkedIn Logo">LinkedIn</a>

              <!-- Website: uncomment once gryphgame.dev is live
              <a class="button button-default" href="https://gryphgame.dev" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Our Website</a>
              -->

              <!-- GitHub: uncomment and add the org link if you want projects public
              <a class="button button-github" href="https://github.com/ORG-NAME" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub Logo">Our Projects</a>
              -->

              <!-- Email: uncomment and add the club email
              <a class="button button-default" href="mailto:CLUB-EMAIL" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon">Email Us</a>
              -->

            </nav>
          </main>

      <footer>
        © 2026 Guelph Game Dev
      </footer>

    </div>
  </div>

</body>

</html>
